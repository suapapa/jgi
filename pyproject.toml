[project]
name = "scrap-dc-krstock"
version = "0.1.0"
description = "DC인사이드 한국주식 갤러리 게시글을 수집해 LLM으로 시장 민심을 요약하는 도구"
readme = "README.md"
authors = [
    { name = "Homin Lee", email = "i@homin.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "lxml>=6.1.0",
    "openai>=2.37.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
]

[project.scripts]
scrap-dc-krstock = "scrap_dc_krstock.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

services:
  krstock:
    build: .
    ports:
      - "18080:8080"
    env_file:
      - .env
    environment:
      REPORTS_DIR: /data/reports
      CACHE_DIR: /data/cache
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8080"
    volumes:
      - ./reports:/data/reports
      - ./cache:/data/cache
    restart: unless-stopped
